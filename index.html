<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; URL=login.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini DMS</title>
    <style>
      :root {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #1f2933;
        background: #f8fafc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .card {
        background: white;
        border-radius: 16px;
        padding: 2rem;
        max-width: 380px;
        width: 100%;
        box-shadow: 0 14px 30px rgba(15, 23, 42, 0.15);
        text-align: center;
      }

      .card h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }

      .card p {
        margin: 0.5rem 0 1rem;
        color: #475569;
        line-height: 1.4;
      }

      .card a {
        color: #1d4ed8;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
    <script src="config.js"></script>
</head>
  <body>
    <div class="card">
      <h1>Mini DMS</h1>
      <p>Anda akan diarahkan ke halaman login. Jika tidak otomatis, klik tautan di bawah.</p>
      <a href="login.html">Buka login</a>
    </div>
  </body>
</html>
